<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Cam — Main Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&family=VT323&display=swap" />

    <style>
        /* =========================================================
           Project Cam — Main Menu   🎃 SPOOKATHON EDITION 🎃
           Nintendo DS–inspired launcher, Halloween repaint.

           All colors live in the :root block below. Change those
           values to swap themes without touching anything else.
           ========================================================= */

        :root {
            /* ----- Halloween palette ----- */
            --menu-bg-a: #2d1b4e;         /* top of the "screen" (deep plum) */
            --menu-bg-b: #0a0415;         /* bottom of the "screen" (midnight) */
            --menu-chrome: #1a0f26;       /* bezel (nearly black plum) */
            --menu-chrome-hi: #3a1f52;    /* bezel highlight */

            --menu-ink: #faf2d8;          /* bone-white screen text */
            --menu-ink-dim: #c7b1dc;      /* dim lavender text */
            --menu-paper: #faeccb;        /* tile face (jack-o-lantern paper) */
            --menu-paper-hi: #fff8e0;     /* tile gloss */
            --menu-line: #26122e;         /* tile hairline (deep plum) */
            --menu-shadow: rgba(0, 0, 0, 0.55);
            --tile-ink: #2a1130;          /* tile text */
            --tile-ink-dim: #6b4c7b;      /* tile dim text */

            --menu-accent: #ff7518;        /* pumpkin orange */
            --menu-accent-glow: #ffb347;   /* soft candle glow */
            --menu-ectoplasm: #9df28a;     /* ghostly green */

            /* Per-tile tints */
            --tile-scribbl-a: #ff7518;    /* pumpkin orange */
            --tile-scribbl-b: #ffb347;    /* candle glow */
            --tile-booth-a:   #8b5cf6;    /* witch purple */
            --tile-booth-b:   #c084fc;    /* lilac */

            /* Motion */
            --t:        240ms cubic-bezier(.22, 1, .36, 1);
            --t-spring: 420ms cubic-bezier(.34, 1.56, .64, 1);   /* overshoot bounce */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--menu-ink);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- Outer "device shell" ---------- */
        body {
            min-height: 100vh;
            padding: 32px;
            background:
                radial-gradient(ellipse at top, var(--menu-chrome-hi), var(--menu-chrome) 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .device {
            width: 100%;
            max-width: 1040px;
            background: var(--menu-chrome);
            border-radius: 28px;
            padding: 18px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .06),
                inset 0 -2px 4px rgba(0, 0, 0, .45),
                0 24px 60px -12px rgba(0, 0, 0, .75),
                0 0 80px -20px rgba(255, 117, 24, .25);   /* faint orange glow */
            position: relative;
            animation: device-pop 700ms cubic-bezier(.34, 1.56, .64, 1) both;
        }
        @keyframes device-pop {
            0%   { opacity: 0; transform: scale(.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Little screw-like dots in each corner of the bezel */
        .device::before,
        .device::after,
        .screw-r,
        .screw-l {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #6b4983, #1a0f26);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.5);
        }
        .device::before { top: 10px;  left: 10px; }
        .device::after  { top: 10px;  right: 10px; }
        .screw-l        { bottom: 10px; left: 10px; }
        .screw-r        { bottom: 10px; right: 10px; }

        /* ---------- The "screen" ---------- */
        .screen {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 110%, rgba(255,117,24,.18), transparent 55%),
                linear-gradient(180deg, var(--menu-bg-a) 0%, var(--menu-bg-b) 100%);
            box-shadow:
                inset 0 0 0 2px rgba(0, 0, 0, .55),
                inset 0 0 80px rgba(0, 0, 0, .35);
            padding: 28px clamp(20px, 4vw, 44px);
        }

        /* Starfield behind the content */
        .screen::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.85), transparent 50%),
                radial-gradient(1.2px 1.2px at 76% 12%, rgba(255,245,210,.75), transparent 50%),
                radial-gradient(1.8px 1.8px at 32% 42%, rgba(255,255,255,.65), transparent 50%),
                radial-gradient(1px   1px   at 58% 68%, rgba(255,255,255,.6),  transparent 50%),
                radial-gradient(1.5px 1.5px at 88% 55%, rgba(255,245,210,.7),  transparent 50%),
                radial-gradient(1px   1px   at 22% 82%, rgba(255,255,255,.5),  transparent 50%),
                radial-gradient(1.2px 1.2px at 68% 32%, rgba(255,255,255,.65), transparent 50%),
                radial-gradient(1px   1px   at 94% 90%, rgba(255,245,210,.6),  transparent 50%),
                radial-gradient(1px   1px   at  5% 55%, rgba(255,255,255,.55), transparent 50%);
            animation: twinkle 4s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: .85; }
            50%      { opacity: .45; }
        }

        /* Subtle CRT-ish scanlines over everything */
        .screen::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,.03) 0px,
                rgba(255,255,255,.03) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: overlay;
            opacity: .35;
        }

        /* ---------- Floating haunts (ghosts, bats, pumpkins) ---------- */
        .haunts {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .haunt {
            position: absolute;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
            opacity: .55;
            will-change: transform;
        }
        .haunt-pumpkin-1 { top: 8%;  left: 4%;  font-size: 36px; animation: drift 7s ease-in-out  -0.4s infinite; }
        .haunt-ghost     { top: 18%; right: 5%; font-size: 42px; animation: drift 8s ease-in-out  -1.2s infinite; opacity: .65; }
        .haunt-bat-1     { top: 46%; left: 8%;  font-size: 28px; animation: drift 6s ease-in-out  -2.1s infinite; }
        .haunt-bat-2     { bottom: 22%; right: 10%; font-size: 32px; animation: drift 9s ease-in-out -3.5s infinite; }
        .haunt-web {
            top: -8px; right: -12px; font-size: 90px;
            opacity: .25; transform: rotate(32deg);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
        }
        .haunt-pumpkin-2 { bottom: 8%; left: 14%; font-size: 24px; animation: drift 10s ease-in-out -0.8s infinite; opacity: .5; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0)   rotate(-4deg); }
            50%      { transform: translate(6px, -14px) rotate(4deg); }
        }

        /* ---------- Top status bar ---------- */
        .status-bar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px 20px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            color: var(--menu-ink);
            letter-spacing: 0.03em;
        }
        .status-left,
        .status-right {
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 8px rgba(255,117,24,.4);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--menu-accent);
            box-shadow: 0 0 10px var(--menu-accent), 0 0 20px var(--menu-accent-glow);
            animation: blink 1.6s ease-in-out infinite;
        }
        @keyframes blink { 0%, 60% { opacity: 1; } 80%, 100% { opacity: .2; } }

        /* ---------- Brand / title block ---------- */
        .brand-block {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 10px 0 24px;
        }
        .brand {
            font-family: 'DM Serif Display', Georgia, serif;
            font-weight: 400;
            font-size: clamp(44px, 7vw, 76px);
            line-height: 1;
            letter-spacing: -0.01em;
            color: var(--menu-ink);
            text-shadow:
                0 2px 0 rgba(0,0,0,.4),
                0 0 20px rgba(255,117,24,.45),
                0 0 44px rgba(255,117,24,.25);
            animation: pop-in .75s cubic-bezier(.34, 1.56, .64, 1) 180ms both;
        }
        .brand .brand-dot {
            display: inline-block;
            width: 16px; height: 16px;
            margin: 0 10px 10px;
            vertical-align: middle;
            background: var(--menu-accent);
            border-radius: 50%;
            box-shadow:
                0 2px 6px rgba(255,117,24,.6),
                0 0 20px rgba(255,117,24,.5);
            animation: throb 2.2s ease-in-out infinite;
        }
        @keyframes throb {
            0%, 100% { transform: scale(1);   box-shadow: 0 2px 6px rgba(255,117,24,.6), 0 0 20px rgba(255,117,24,.5); }
            50%      { transform: scale(1.2); box-shadow: 0 2px 10px rgba(255,117,24,.8), 0 0 32px rgba(255,117,24,.8); }
        }

        .subtitle {
            margin-top: 10px;
            font-family: 'Creepster', 'VT323', monospace;
            font-size: 32px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--menu-accent-glow);
            text-shadow:
                0 2px 0 rgba(0,0,0,.4),
                0 0 12px rgba(255,117,24,.6);
            animation: pop-in .65s cubic-bezier(.34, 1.56, .64, 1) 360ms both;
        }
        .subtitle .bat {
            display: inline-block;
            margin: 0 14px;
            font-size: 24px;
            vertical-align: middle;
            animation: wiggle 3s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
        }
        .subtitle .bat.right { animation-delay: -1.5s; }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-10deg); }
            50%      { transform: rotate(14deg); }
        }

        @keyframes pop-in {
            0%   { opacity: 0; transform: scale(.4) translateY(14px); }
            60%  { transform: scale(1.08) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ---------- Tile grid ---------- */
        .tiles {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            padding: 12px 0 28px;
            max-width: 920px;
            margin: 0 auto;
        }

        .tile {
            --a: var(--tile-scribbl-a);
            --b: var(--tile-scribbl-b);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            aspect-ratio: 1 / 1.08;
            padding: 20px 16px 18px;
            border-radius: 18px;
            background:
                radial-gradient(ellipse at top, var(--menu-paper-hi) 0%, var(--menu-paper) 55%);
            color: var(--tile-ink);
            text-decoration: none;
            box-shadow:
                inset 0 0 0 2px var(--menu-line),
                inset 0 -4px 0 rgba(0, 0, 0, .08),
                0 6px 0 rgba(0, 0, 0, .35),
                0 14px 24px -8px var(--menu-shadow),
                0 0 24px -4px color-mix(in srgb, var(--a) 40%, transparent);  /* lantern glow */
            transition:
                transform var(--t-spring),
                box-shadow var(--t);
            overflow: hidden;
            animation: tile-pop .8s cubic-bezier(.34, 1.56, .64, 1) both;
            will-change: transform;
        }
        .tile:nth-child(1) { animation-delay: 520ms; }
        .tile:nth-child(2) { animation-delay: 660ms; }
        .tile:nth-child(3) { animation-delay: 800ms; }

        @keyframes tile-pop {
            0%   { opacity: 0; transform: scale(.35) translateY(40px) rotate(-6deg); }
            55%  { opacity: 1; transform: scale(1.08) translateY(-6px) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0); }
        }

        /* Big colored halo at the top of each tile */
        .tile::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -10%;
            right: -10%;
            height: 70%;
            background: radial-gradient(ellipse at center bottom, var(--a), transparent 65%);
            opacity: .28;
            transition: opacity var(--t), top var(--t);
            pointer-events: none;
        }
        /* Glossy sheen across the tile face */
        .tile::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 42%;
            background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
            pointer-events: none;
        }

        .tile:hover,
        .tile:focus-visible {
            transform: translateY(-8px) scale(1.04);
            outline: none;
            box-shadow:
                inset 0 0 0 2px var(--menu-line),
                inset 0 -4px 0 rgba(0, 0, 0, .08),
                0 12px 0 rgba(0, 0, 0, .35),
                0 24px 36px -8px var(--menu-shadow),
                0 0 0 3px color-mix(in srgb, var(--a) 70%, transparent),
                0 0 48px -4px color-mix(in srgb, var(--a) 70%, transparent);
        }
        .tile:hover::before,
        .tile:focus-visible::before { opacity: .5; top: -28%; }
        .tile:active {
            transform: translateY(2px) scale(.98);
            transition-duration: 90ms;
            box-shadow:
                inset 0 0 0 2px var(--menu-line),
                inset 0 -2px 0 rgba(0, 0, 0, .08),
                0 2px 0 rgba(0, 0, 0, .35),
                0 6px 16px -6px var(--menu-shadow);
        }

        .tile-icon {
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(145deg, var(--a), var(--b));
            box-shadow:
                inset 0 2px 0 rgba(255,255,255,.4),
                inset 0 -3px 0 rgba(0,0,0,.25),
                0 8px 16px -4px color-mix(in srgb, var(--a) 60%, transparent);
            font-size: 44px;
            margin-top: auto;
            position: relative;
            z-index: 1;
            transition: transform var(--t-spring);
        }
        .tile:hover .tile-icon,
        .tile:focus-visible .tile-icon {
            transform: scale(1.08) rotate(-4deg);
        }

        .tile-name {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 24px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.01em;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .tile-sub {
            font-family: 'VT323', monospace;
            font-size: 15px;
            color: var(--tile-ink-dim);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        /* Per-tile tints */
        .tile-scribbl { --a: var(--tile-scribbl-a); --b: var(--tile-scribbl-b); }
        .tile-booth   { --a: var(--tile-booth-a);   --b: var(--tile-booth-b); }

        /* ---------- Bottom hint bar ---------- */
        .hint-bar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            padding: 8px 0 2px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            color: var(--menu-ink-dim);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(157, 242, 138, .25);
            animation: fade-in .6s ease-out 900ms both;
        }
        .hint-bar .glyph {
            color: var(--menu-accent);
            animation: wiggle 2.4s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Reduce motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ---------- Mobile tweaks ---------- */
        @media (max-width: 520px) {
            body { padding: 12px; }
            .device { padding: 10px; border-radius: 20px; }
            .screen { padding: 20px 14px; }
            .brand { font-size: 46px; }
            .subtitle { font-size: 26px; letter-spacing: 0.1em; }
            .subtitle .bat { font-size: 20px; margin: 0 8px; }
            .tiles { gap: 14px; }
            .tile { aspect-ratio: 1 / 1.1; padding: 16px 10px 14px; }
            .tile-icon { width: 72px; height: 72px; font-size: 36px; }
            .tile-name { font-size: 20px; }
            .haunt-web { font-size: 60px; }
            .haunt-ghost { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="device">
        <span class="screw-l"></span>
        <span class="screw-r"></span>

        <div class="screen">
            <!-- Starfield + scanlines handled by .screen::before / ::after -->

            <!-- Floating spooky decorations -->
            <div class="haunts" aria-hidden="true">
                <span class="haunt haunt-web">🕸️</span>
                <span class="haunt haunt-pumpkin-1">🎃</span>
                <span class="haunt haunt-ghost">👻</span>
                <span class="haunt haunt-bat-1">🦇</span>
                <span class="haunt haunt-bat-2">🦇</span>
                <span class="haunt haunt-pumpkin-2">🎃</span>
            </div>

            <!-- Top status bar -->
            <div class="status-bar">
                <div class="status-left">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>PROJECT CAM v1.0</span>
                </div>
                <div class="status-right">
                    <span id="clock">--:--</span>
                    <span>·</span>
                    <span id="date">—</span>
                </div>
            </div>

            <!-- Brand block -->
            <header class="brand-block">
                <h1 class="brand">
                    Project<span class="brand-dot" aria-hidden="true"></span>Cam
                </h1>
                <p class="subtitle">
                    <span class="bat" aria-hidden="true">🦇</span>Main Menu<span class="bat right" aria-hidden="true">🦇</span>
                </p>
            </header>

            <!-- Tile grid -->
            <nav class="tiles" aria-label="Game modes">
                <a class="tile tile-scribbl" href="scribblcam.html">
                    <div class="tile-icon" aria-hidden="true">✍️</div>
                    <div class="tile-name">ScribblCam</div>
                    <div class="tile-sub">Draw · Guess · Win</div>
                </a>

                <a class="tile tile-booth" href="photobooth/index.html">
                    <div class="tile-icon" aria-hidden="true">📸</div>
                    <div class="tile-name">Photo Booth</div>
                    <div class="tile-sub">Hand Frames · Filters</div>
                </a>
            </nav>

            <!-- Bottom hint bar -->
            <div class="hint-bar">
                <span class="glyph" aria-hidden="true">🎃</span>
                <span>Pick a cart</span>
                <span class="glyph" aria-hidden="true">🎃</span>
            </div>
        </div>
    </div>

    <script>
        // ---------- Live clock (vintage DS vibe) ----------
        (function clock() {
            const clockEl = document.getElementById('clock');
            const dateEl  = document.getElementById('date');
            const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
            function tick() {
                const d = new Date();
                const hh = String(d.getHours()).padStart(2, '0');
                const mm = String(d.getMinutes()).padStart(2, '0');
                clockEl.textContent = `${hh}:${mm}`;
                dateEl.textContent  = `${months[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')}`;
            }
            tick();
            setInterval(tick, 15_000);
        })();

        // ---------- Arrow-key tile selection (DS feel, still works silently) ----------
        (function keyboardNav() {
            const tiles = [...document.querySelectorAll('.tile:not(.locked)')];
            if (!tiles.length) return;
            let i = 0;
            // Focus the first tile after the pop-in animation settles.
            setTimeout(() => tiles[i].focus(), 900);
            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    i = (i + 1) % tiles.length;
                    tiles[i].focus();
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    i = (i - 1 + tiles.length) % tiles.length;
                    tiles[i].focus();
                } else if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active && active.classList.contains('tile')) active.click();
                }
            });
        })();
    </script>
</body>
</html>
